# Checks every pull request into develop and every change to develop (etalii.adp spec 001-ci-and-badges), and
# starts the publication of what is merged (etalii.adp spec 011-notion-repository, contracts/publication.md).
# The test job runs the tests, the linter and the type check of the shared parts. The addons job writes the tree
# this repository publishes at https://etalii.net/adp-notion, with the same command the deploy workflow of
# etalii.adp.site runs, and checks it (etalii.adp spec 012-notion-hype-cycle-addon, contracts/published-tree.md).
# The publish job uploads nothing: on a push to develop it starts that deploy workflow, which builds this
# repository beside the site.
name: Build

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install pyyaml
      - name: Check JSON, YAML and markdown links
        run: python .github/scripts/check-files.py

  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - name: Run the tests, the words test among them
        run: npm test
      - run: npm run lint
      - run: npm run typecheck

  addons:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build the published tree
        run: node scripts/build.mjs --out "$RUNNER_TEMP/adp-notion"
      - name: Check the add-on index names this revision
        run: |
          test -f "$RUNNER_TEMP/adp-notion/index.html"
          grep -q "$(git rev-parse HEAD)" "$RUNNER_TEMP/adp-notion/index.html"
      - name: Check every add-on is published
        run: |
          for folder in addons/*/; do
            [ -d "$folder" ] || continue
            test -f "$RUNNER_TEMP/adp-notion/$(basename "$folder")/index.html"
          done
      # The files of every add-on's folder, no name of a tool type in addon.js, and nothing that reads as a secret.
      # This job reads no secret, so there is no text of one to search for.
      - name: Check the published tree
        run: node scripts/check-tree.mjs "$RUNNER_TEMP/adp-notion"
      - name: Check every copy against its PROVENANCE.md
        run: |
          node scripts/sync-specifications.mjs --check
          node scripts/sync-fbl.mjs --check
          node scripts/sync-examples.mjs --check

  # Flags a retired use of the ADP vocabulary (etalii.adp spec 002, FR-017). The runner and its list of retired
  # patterns and allowances live in etalii.adp and are read from its develop branch, so every repository is checked
  # against the same list.
  terminology:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check the vocabulary against the glossary
        env:
          SOURCE: https://raw.githubusercontent.com/etalii-adp/etalii.adp/develop
        run: |
          curl -fsSL "$SOURCE/.github/scripts/terminology-check.py" -o "$RUNNER_TEMP/terminology-check.py"
          python "$RUNNER_TEMP/terminology-check.py" --name "${{ github.event.repository.name }}" --config "$SOURCE/docs/terminology-check.json"

  # The two jobs below are the only ones that read a secret. A pull request, from a fork or not,
  # never runs them.

  # Deploys the service, a Cloudflare Worker (etalii.adp spec 012, contracts/service.md). It runs
  # beside the publication of the pages and not in one step with it, so an add-on must work against
  # the Worker of the merge before. A deployment that fails leaves the previous Worker serving.
  service:
    needs: [check, test, addons]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config service/wrangler.toml

  publish:
    needs: [check, test, addons]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Start the site's deployment
        env:
          GH_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: gh workflow run deploy.yml --repo etalii-adp/etalii.adp.site --ref develop
